{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-[#EAF8FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PEDO ALIGN</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'patient/css/patient.css' %}">
</head>
<body class="min-h-full flex flex-col justify-center py-10 px-4 sm:px-6 bg-[#EAF8FA] antialiased font-sans text-slate-700">

    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        
        <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
            
            <div class="p-6 text-center border-b border-slate-100 bg-white">
                <a href="/" class="inline-block focus:outline-none">
                    <img src="{% static 'sidebar_glowing_logo.png' %}" alt="PEDO ALIGN" onerror="this.onerror=null; this.src='/static/sidebar_glowing_logo.png';" class="max-w-[160px] mx-auto h-auto object-contain">
                </a>
                <h2 class="text-base font-semibold text-slate-900 mt-3">Reset Patient Password</h2>
                <p class="text-xs text-slate-500 mt-0.5">Enter your registered email address to receive recovery instructions</p>
            </div>

            <div class="p-6 sm:p-7 space-y-4">
                <form method="POST" class="space-y-3.5">
                    {% csrf_token %}
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Registered Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-envelope text-xs"></i>
                            </div>
                            <input type="email" name="email" required placeholder="patient@example.com" class="form-input-patient pl-9 text-xs" autofocus>
                        </div>
                    </div>

                    <div class="pt-1">
                        <button type="submit" class="w-full btn-patient-primary py-2.5 text-xs font-medium">
                            Send Reset Link
                        </button>
                    </div>
                </form>

                <div class="pt-3 border-t border-slate-100 text-center">
                    <a href="{% url 'patient:login' %}" class="text-xs font-medium text-blue-600 hover:text-blue-800 transition">
                        <i class="fa-solid fa-arrow-left text-[10px] mr-1"></i> Back to Sign In
                    </a>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
