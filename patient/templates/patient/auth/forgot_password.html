{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F4F9FF]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PEDO ALIGN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'patient/css/patient.css' %}">
</head>
<body class="h-full flex items-center justify-center p-4 bg-[#F4F9FF] antialiased">

    <div class="w-full max-w-md">
        
        <div class="bg-white rounded-3xl shadow-xl border border-blue-100 overflow-hidden">
            
            <div class="relative bg-cover bg-center p-6 text-center border-b border-blue-100/80" style="background-image: url('{% static 'bg.png' %}?v=2305');">
                <img src="{% static 'sidebar_glowing_logo.png' %}?v=2305" alt="PEDO ALIGN" onerror="this.src='/static/sidebar_glowing_logo.png'" class="max-w-[210px] mx-auto h-auto object-contain drop-shadow-sm">
                <p class="text-xs text-blue-950 font-bold mt-1.5">Account Recovery</p>
            </div>

            <div class="p-8 sm:p-10 space-y-5">
                <div class="text-center">
                    <h2 class="text-xl font-black text-slate-900 tracking-tight">Forgot Password?</h2>
                    <p class="text-xs text-slate-500 mt-1">Enter your registered email address to reset your account password</p>
                </div>

                <form method="POST" class="space-y-4">
                    {% csrf_token %}
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Registered Email</label>
                        <input type="email" name="email" required placeholder="patient@example.com" class="form-input-patient">
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full btn-patient-primary py-3 text-sm font-bold shadow-md">
                            Send Reset Instructions
                        </button>
                    </div>
                </form>

                <div class="pt-4 border-t border-slate-100 text-center">
                    <a href="{% url 'patient:login' %}" class="text-xs font-bold text-blue-600 hover:underline">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Sign In
                    </a>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
