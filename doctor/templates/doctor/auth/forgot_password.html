{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PEDO ALIGN</title>
    
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'doctor/css/custom.css' %}">
</head>
<body class="h-full flex items-center justify-center p-4 bg-slate-50 antialiased">

    <div class="w-full max-w-md">
        
        <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
            
            <div class="p-6 text-center border-b border-slate-100 bg-white">
                <a href="{% url 'doctor:landing' %}" class="inline-block focus:outline-none">
                    <img src="{% static 'sidebar_glowing_logo.png' %}" alt="PEDO ALIGN" onerror="this.onerror=null; this.src='/static/sidebar_glowing_logo.png';" class="max-w-[170px] mx-auto h-auto object-contain">
                </a>
                <h2 class="text-base font-semibold text-slate-900 mt-3">Reset Doctor Password</h2>
                <p class="text-xs text-slate-500 mt-0.5">Enter your registered email to receive password reset instructions</p>
            </div>

            <div class="p-6 sm:p-8">

            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                <div class="p-3 rounded-lg text-xs font-medium {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Registered Email Address</label>
                    <input type="email" name="email" required placeholder="doctor@clinic.com" class="form-input text-xs" autofocus>
                </div>

                <div class="pt-1">
                    <button type="submit" class="w-full btn-primary py-2.5 text-xs font-medium">
                        Send Reset Instructions
                    </button>
                </div>
            </form>

            <div class="mt-5 pt-4 border-t border-slate-100 text-center">
                <a href="{% url 'doctor:login' %}" class="text-xs font-medium text-blue-600 hover:text-blue-800">
                    <i class="fa-solid fa-arrow-left text-[11px] mr-1"></i> Back to Doctor Login
                </a>
            </div>

            </div>

        </div>

    </div>

</body>
</html>
