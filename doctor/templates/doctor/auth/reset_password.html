{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - PEDO ALIGN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'doctor/css/custom.css' %}">
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 via-sky-50 to-slate-100 antialiased">

    <div class="w-full max-w-md">
        
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200/80 overflow-hidden">
            
            <!-- Glowing Header Banner with assent/bg.png -->
            <div class="relative bg-cover bg-center p-6 text-center border-b border-blue-100/80" style="background-image: url('{% static 'bg.png' %}?v=2305');">
                <img src="{% static 'sidebar_glowing_logo.png' %}?v=2305" alt="PEDO ALIGN DOCTOR PORTAL" onerror="this.src='/static/sidebar_glowing_logo.png'" class="max-w-[210px] mx-auto h-auto object-contain drop-shadow-sm">
                <p class="text-xs text-blue-950 font-bold mt-1.5">Doctor Account Security</p>
            </div>

            <div class="p-8 sm:p-10">
                <div class="text-center mb-6">
                    <h2 class="text-lg font-bold text-slate-900">Choose New Password</h2>
                    <p class="text-xs text-slate-500 mt-1">Create a new secure password for your doctor account</p>
                </div>

            {% if messages %}
            <div class="mb-5 space-y-2">
                {% for message in messages %}
                <div class="p-3 rounded-lg text-xs font-semibold {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Registered Email</label>
                    <input type="email" name="email" value="{{ email|default:'' }}" required placeholder="doctor@clinic.com" class="form-input">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">New Password (min 8 chars)</label>
                    <input type="password" name="new_password" required placeholder="••••••••" class="form-input">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Confirm New Password</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" class="form-input">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full btn-primary py-2.5 text-sm font-bold shadow-md transition">
                        Save New Password & Sign In
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                <a href="{% url 'doctor:login' %}" class="text-xs font-semibold text-blue-600 hover:text-blue-800 hover:underline">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Doctor Login
                </a>
            </div>

            </div><!-- /p-8 -->

        </div>

    </div>

</body>
</html>
