{% load static %}
<!-- ============================================== -->
<!-- UNIVERSAL PWA PHONE INSTALLATION & MANAGER      -->
<!-- ============================================== -->

<!-- Installation Status Toast Notification -->
<div id="pwaToastBox" class="fixed top-4 inset-x-0 z-[100] flex justify-center pointer-events-none px-4 transition-all duration-300 opacity-0 -translate-y-4">
    <div id="pwaToastContent" class="pointer-events-auto bg-slate-900/95 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700/60 max-w-sm w-full text-xs font-semibold backdrop-blur-md">
        <div id="pwaToastIconWrap" class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0 text-sm">
            <i id="pwaToastIcon" class="fa-solid fa-circle-check"></i>
        </div>
        <span id="pwaToastMessage" class="flex-1 text-slate-100 leading-snug">Notice message</span>
        <button type="button" onclick="hidePwaToast()" class="text-slate-400 hover:text-white p-1">
            <i class="fa-solid fa-xmark text-xs"></i>
        </button>
    </div>
</div>

<script>
    let pwaDeferredPrompt = null;
    let toastTimer = null;

    // 1. Detect if App is already running in Standalone Mode or installed
    function checkIsAppInstalled() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true ||
               document.referrer.includes('android-app://') ||
               localStorage.getItem('pedo_align_pwa_installed') === 'true';
    }

    // 2. Toast Notification Feedback (Success, Warning, Error, Info)
    function showPwaToast(type, message) {
        const box = document.getElementById('pwaToastBox');
        const msgEl = document.getElementById('pwaToastMessage');
        const iconEl = document.getElementById('pwaToastIcon');
        const iconWrap = document.getElementById('pwaToastIconWrap');

        if (!box || !msgEl) return;

        msgEl.innerText = message;
        if (type === 'success') {
            iconWrap.className = 'w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-check';
        } else if (type === 'warning') {
            iconWrap.className = 'w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-exclamation';
        } else if (type === 'error') {
            iconWrap.className = 'w-6 h-6 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-xmark';
        } else {
            iconWrap.className = 'w-6 h-6 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-info';
        }

        box.classList.remove('opacity-0', '-translate-y-4');
        box.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            hidePwaToast();
        }, 5000);
    }

    function hidePwaToast() {
        const box = document.getElementById('pwaToastBox');
        if (box) {
            box.classList.remove('opacity-100', 'translate-y-0');
            box.classList.add('opacity-0', '-translate-y-4');
        }
    }

    // 3. Update Install UI elements across page
    function updateInstallUIState(isInstalled) {
        const buttons = document.querySelectorAll('.pwa-install-btn');
        const textElements = document.querySelectorAll('.pwa-install-btn-text');

        if (isInstalled) {
            buttons.forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-blue-600', 'via-sky-500', 'to-cyan-500', 'hover:from-blue-700', 'hover:to-cyan-600');
                btn.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
            });
            textElements.forEach(el => {
                    el.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> INSTALL THE APP';
            });
        } else if (pwaDeferredPrompt) {
            textElements.forEach(el => {
                el.innerText = 'INSTALL THE APP';
            });
        }
    }

    // Capture browser beforeinstallprompt event
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        pwaDeferredPrompt = e;
        window.pwaDeferredPrompt = e;
        updateInstallUIState(false);
    });

    // Capture appinstalled event
    window.addEventListener('appinstalled', () => {
        pwaDeferredPrompt = null;
        updateInstallUIState(true);
        showPwaToast('success', 'INSTALL THE APP is ready on your device.');
    });

    // Register Service Worker with root scope '/'
    function registerPWAServiceWorker() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => {
                    console.log('PEDO ALIGN: Service Worker active with scope', reg.scope);
                })
                .catch(err => {
                    console.warn('PEDO ALIGN: SW registration skipped', err);
                });
        }
        if (checkIsAppInstalled()) {
            updateInstallUIState(true);
        }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        registerPWAServiceWorker();
    } else {
        window.addEventListener('DOMContentLoaded', registerPWAServiceWorker);
    }

    // Open the browser's native PWA installation prompt from the user's click.
    async function triggerPWAInstall() {
        if (checkIsAppInstalled()) {
            showPwaToast('info', 'INSTALL THE APP is already installed on this device.');
            return;
        }

        if (!pwaDeferredPrompt) {
            showPwaToast('info', 'Open this page in Chrome over HTTPS to install it with the app logo.');
            return;
        }

        try {
            const installPrompt = pwaDeferredPrompt;
            pwaDeferredPrompt = null;
            await installPrompt.prompt();
            const choiceResult = await installPrompt.userChoice;
            if (choiceResult && choiceResult.outcome === 'accepted') {
                showPwaToast('success', 'Installing INSTALL THE APP...');
            } else {
                showPwaToast('warning', 'Installation was cancelled. You can try again anytime.');
            }
        } catch (err) {
            console.error('PWA prompt execution error:', err);
            showPwaToast('error', 'The browser could not start installation. Please try again.');
        }
}
</script>
