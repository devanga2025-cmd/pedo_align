{% load static %}
<!-- ============================================== -->
<!-- UNIVERSAL PWA PHONE INSTALLATION & MANAGER      -->
<!-- ============================================== -->

<!-- Installation Status Toast Notification -->
<div id="pwaToastBox" class="hidden fixed top-4 inset-x-0 z-[100] flex justify-center pointer-events-none px-4 transition-all duration-300 opacity-0 -translate-y-4">
    <div id="pwaToastContent" class="pointer-events-auto bg-slate-900/95 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700/60 max-w-sm w-full text-xs font-semibold backdrop-blur-md">
        <div id="pwaToastIconWrap" class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0 text-sm">
            <i id="pwaToastIcon" class="fa-solid fa-circle-check"></i>
        </div>
        <span id="pwaToastMessage" class="flex-1 text-slate-100 leading-snug">Notice message</span>
        <a id="pwaOpenChromeLink" class="hidden text-sky-300 underline whitespace-nowrap" href="#" target="_blank" rel="noopener">Open in Chrome</a>
        <button type="button" onclick="hidePwaToast()" class="text-slate-400 hover:text-white p-1">
            <i class="fa-solid fa-xmark text-xs"></i>
        </button>
    </div>
</div>

<script>
    let pwaDeferredPrompt = null;
    let toastTimer = null;

    const PWA_INSTALL_COPY = {
        ios: 'In Safari, tap Share, then choose Add to Home Screen.',
        browser: 'Use your browser’s built-in install option to add PEDO ALIGN to your home screen.',
        installed: 'PEDO ALIGN is already installed on this device.'
    };

    // 1. Detect if App is already running in Standalone Mode or installed
    function checkIsAppInstalled() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches ||
               window.navigator.standalone === true ||
               document.referrer.includes('android-app://');
    }

    function isIOSDevice() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function isAndroidDevice() {
        return /android/i.test(navigator.userAgent);
    }

    function isInAppBrowser() {
        const ua = navigator.userAgent || '';
        return /; wv\)|\bwv\b|Instagram|FBAN|FBAV|FB_IAB|WhatsApp|Line\/|Twitter|TikTok|Snapchat/i.test(ua);
    }

    function getChromeOpenUrl() {
        const url = new URL(window.location.href);
        if (isIOSDevice()) {
            url.protocol = url.protocol === 'https:' ? 'googlechromes:' : 'googlechrome:';
            return url.toString();
        }
        if (!isAndroidDevice()) return url.toString();
        return `intent://${url.host}${url.pathname}${url.search}${url.hash}#Intent;scheme=${url.protocol.slice(0, -1)};package=com.android.chrome;end`;
    }

    // 2. Toast Notification Feedback (Success, Warning, Error, Info)
    function showPwaToast(type, message) {
        const box = document.getElementById('pwaToastBox');
        const msgEl = document.getElementById('pwaToastMessage');
        const iconEl = document.getElementById('pwaToastIcon');
        const iconWrap = document.getElementById('pwaToastIconWrap');
        const chromeLink = document.getElementById('pwaOpenChromeLink');

        if (!box || !msgEl) return;

        msgEl.innerText = message;
        if (chromeLink) chromeLink.classList.add('hidden');
        if (type === 'success') {
            iconWrap.className = 'w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-check';
        } else if (type === 'warning') {
            iconWrap.className = 'w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-exclamation';
        } else if (type === 'error') {
            iconWrap.className = 'w-6 h-6 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-xmark';
        } else {
            iconWrap.className = 'w-6 h-6 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center flex-shrink-0 text-sm';
            iconEl.className = 'fa-solid fa-circle-info';
        }

        box.classList.remove('hidden');
        void box.offsetHeight; // Trigger reflow for transition
        box.classList.remove('opacity-0', '-translate-y-4');
        box.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            hidePwaToast();
        }, 5000);
    }

    function hidePwaToast() {
        const box = document.getElementById('pwaToastBox');
        if (box) {
            box.classList.remove('opacity-100', 'translate-y-0');
            box.classList.add('opacity-0', '-translate-y-4');
            setTimeout(() => {
                if (box.classList.contains('opacity-0')) {
                    box.classList.add('hidden');
                }
            }, 300);
        }
    }

    function showOpenInChromeOption() {
        showPwaToast('info', 'This in-app browser may not support web app installation.');
        const chromeLink = document.getElementById('pwaOpenChromeLink');
        if (chromeLink && isAndroidDevice()) {
            chromeLink.href = getChromeOpenUrl();
            chromeLink.classList.remove('hidden');
        }
    }

    // 3. Update Install UI elements across page
    function updateInstallUIState(isInstalled) {
        const buttons = document.querySelectorAll('.pwa-install-btn');
        const textElements = document.querySelectorAll('.pwa-install-btn-text');

        if (isInstalled) {
            buttons.forEach(btn => {
                btn.classList.remove('bg-gradient-to-r', 'from-blue-600', 'via-sky-500', 'to-cyan-500', 'hover:from-blue-700', 'hover:to-cyan-600');
                btn.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
            });
            textElements.forEach(el => {
                    el.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> INSTALL THE APP';
            });
        } else if (pwaDeferredPrompt) {
            textElements.forEach(el => {
                el.innerText = 'INSTALL THE APP';
            });
        }
    }

    // Capture browser beforeinstallprompt event. It can fire after page load,
    // and must be retained until a user gesture calls prompt().
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        pwaDeferredPrompt = e;
        window.pwaDeferredPrompt = e;
        updateInstallUIState(false);
    });

    // Capture appinstalled event
    window.addEventListener('appinstalled', () => {
        pwaDeferredPrompt = null;
        updateInstallUIState(true);
        showPwaToast('success', 'PEDO ALIGN was added to your device.');
    });

    // Register Service Worker with root scope '/'
    function registerPWAServiceWorker() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => {
                    console.log('PEDO ALIGN: Service Worker active with scope', reg.scope);
                    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                })
                .catch(err => {
                    console.error('PEDO ALIGN: Service Worker registration failed', err);
                });
        }
        if (checkIsAppInstalled()) {
            updateInstallUIState(true);
        }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        registerPWAServiceWorker();
    } else {
        window.addEventListener('DOMContentLoaded', registerPWAServiceWorker);
    }

    // Open the native install prompt when available; otherwise directly download the APK.
    async function triggerPWAInstall() {
        if (checkIsAppInstalled()) {
            showPwaToast('info', PWA_INSTALL_COPY.installed);
            return;
        }

        if (pwaDeferredPrompt) {
            try {
                const installPrompt = pwaDeferredPrompt;
                pwaDeferredPrompt = null;
                await installPrompt.prompt();
                const choiceResult = await installPrompt.userChoice;
                if (choiceResult && choiceResult.outcome === 'accepted') {
                    showPwaToast('success', 'Installing PEDO ALIGN...');
                    return;
                } else {
                    showPwaToast('warning', 'Installation was cancelled. You can also download the Android APK directly.');
                    return;
                }
            } catch (err) {
                console.warn('Native prompt failed, falling back to direct APK download:', err);
            }
        }

        if (isIOSDevice()) {
            showPwaToast('info', PWA_INSTALL_COPY.ios);
            return;
        }

        // Direct mobile/browser download for Android or desktop browser
        showPwaToast('success', 'Downloading PEDO ALIGN Android APK to your device...');
        const dlLink = document.createElement('a');
        dlLink.href = '/download/app/';
        dlLink.download = 'PedoAlign.apk';
        document.body.appendChild(dlLink);
        dlLink.click();
        document.body.removeChild(dlLink);
    }
</script>
